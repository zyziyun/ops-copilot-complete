[project]
name = "ops-copilot"
version = "0.1.0"
description = "Internal Ops/Support Copilot — async FastAPI + pgvector + LangGraph agent + two MCP servers"
requires-python = ">=3.12"
dependencies = [
  # web / async backend
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
  "gunicorn>=23.0,<24.0",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.30,<0.31",
  "pgvector>=0.3.6,<0.4",
  "alembic>=1.13,<1.15",
  "pydantic-settings>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<0.29",
  # LLM / agent
  "openai>=1.50,<2.0",
  "langgraph>=0.2.60,<0.3",
  "langgraph-prebuilt>=0.1.1,<0.3",
  "langgraph-checkpoint>=2.1.2,<3.0",
  "langchain-core>=0.3.25,<0.4",
  "langchain-openai>=0.2.10,<0.3",
  "langgraph-checkpoint-postgres>=2.0.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "tenacity>=9.0,<10.0",
  # MCP
  "mcp[cli]>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the runtime image needs the app and the MCP servers; eval/ and scripts/ are
# dev/CI-only and run from the source tree, not installed
packages = ["app", "mcp_servers"]
# never ship tests / dev-only helpers in the wheel or runtime image
exclude = ["**/tests", "**/conftest.py", "app/testing.py"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# co-located unit tests under app/**/tests; the single e2e test under tests/e2e
testpaths = ["app", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
