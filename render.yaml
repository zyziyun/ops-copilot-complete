services:
  - type: web
    name: ops-copilot-api
    env: docker
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ops-pg
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # set in dashboard, never in repo
      - key: SEARCH_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: text-embedding-3-small
      - key: CHAT_MODEL
        value: gpt-4o-mini
databases:
  - name: ops-pg
    plan: free
